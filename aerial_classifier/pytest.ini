# Конфигурация pytest.
#
# --durations=15 — печатать 15 самых долгих тестов с их временем. Итоговую
# строку «N passed in Xs» pytest показывает и так, но по ней не видно, ЧТО
# именно считалось долго; здесь набор быстрый (~2 c), и если один тест вдруг
# вырастет до секунд, это сразу бросится в глаза.
# --durations-min=0.0 — не прятать даже мгновенные: пусть время видно у всех
# попавших в топ, а не только у тех, что дольше порога по умолчанию.
[pytest]
testpaths = tests
addopts = -ra --durations=15 --durations-min=0.0
