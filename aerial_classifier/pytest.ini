# pytest configuration.
#
# --durations=15 — print the 15 slowest tests with their times. pytest shows the
# final "N passed in Xs" line anyway, but it does not reveal WHAT took long;
# this suite is fast (~2 s), and if one test suddenly grows to seconds it is
# immediately visible.
# --durations-min=0.0 — do not hide even instant ones: show the time for
# everything that made the top, not only for those above the default threshold.
[pytest]
testpaths = tests
addopts = -ra --durations=15 --durations-min=0.0
